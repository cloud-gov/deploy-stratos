---
jobs:
  - name: set-self
    plan:
      - get: config
        trigger: true
#      - set_pipeline: self
#        file: config/ci/pipeline.yml

  - name: compile-assets
    serial: true
    plan:
      - in_parallel:
          - get: stratos-source
            trigger: true
          - get: config
            passed: [set-self]
            trigger: true
          - get: general-task
      - task: precompile
        image: general-task
        config:
          platform: linux
          inputs:
            - name: stratos-source
            - name: config
          outputs:
            - name: pre-compiled
          params:
            NG_CLI_ANALYTICS: "false"
          caches:
            - path: .npm
            - path: stratos-source/node_modules
          run:
            path: sh
            args:
              - -ilexc
              - |
                cd stratos-source

                export NODE_OPTIONS=--openssl-legacy-provider

                cp -a ../config/custom_theme ./src/frontend/packages/custom_theme
                cp ../config/stratos.yaml .
                npm config set cache $(pwd)/../.npm --global
                npm install
                npm run dev-setup && npm run build-devkit && npm run clean-symlinks && npm run store-git-metadata && npm run prepare-backend
                npm run prebuild-ui
                cp ../config/manifest.yml .

                tar -czf ../pre-compiled/precompiled-stratos.tgz \
                  --exclude-ignore=.cfignore \
                  .
      - put: pre-compiled
        params:
          file: pre-compiled/precompiled-stratos.tgz
  - name: compile-stratos
    serial: true
    plan:
      - in_parallel:
          - get: pre-compiled
            passed: [compile-assets]
            trigger: true
            params:
              unpack: true
          - get: general-task
      - task: build-stratos
        image: general-task
        config:
          platform: linux
          inputs:
            - name: pre-compiled
          outputs:
            - name: compiled
          run:
            path: /bin/sh
            args:
              - -cx
              - |
                ls -lah ./pre-compiled
                apt-get update && apt-get install unzip
                cd pre-compiled
                ls -lah
                rm -rf dist
                deploy/cloud-foundry/build.sh
                tar zcvf compiled-stratos.tgz .
                mv compiled-stratos.tgz ../compiled/

      - put: compiled
        params:
          file: compiled/compiled-stratos.tgz
  - name: deploy-dev
    serial: true
    plan:
      - in_parallel:
          - get: compiled
            passed: [compile-stratos]
            trigger: true
            params:
              unpack: true
          - get: general-task
      - put: create-db
        resource: cf-cli-dev
        params: &db-params
          command: create-service
          update_service: true
          # Note, the RDS broker doesn't return the correct status while provisioning:
          # https://github.com/18F/aws-broker/issues/59
          # If a new deployment, manually re-trigger the build once the RDS is up.
          wait_for_service: true
          timeout: 1200 # RDS take a long time to provision
          service_instance: stratos-db
          service: aws-rds
          plan: medium-psql
      - put: cf-dev
        params:
          path: compiled
          current_app_name: stratos
          manifest: compiled/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((dev-cf-route))
          environment_variables:
            GO_SHA256: "aaaa70f2fb5a7803"
            CF_API_URL: ((dev-cf-api-url))
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((dev-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((dev-cf-client-secret))
            SESSION_STORE_SECRET: ((dev-session-store-secret))
            DB_SSL_MODE: "verify-ca"
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos on dev
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((dev-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

  # ══════════════════════════════════════════════════════════════
  # stratos-v3 — dev-only, CF API v3 compatible build & deploy.
  # Fully independent of the existing stratos flow. These jobs are
  # leaf jobs: they do NOT feed staging or production.
  # ══════════════════════════════════════════════════════════════
  - name: compile-stratos-v3
    serial: true
    plan:
      - in_parallel:
          - get: stratos-v3-source
            trigger: true
          - get: config
            trigger: true
          - get: general-task
      - task: build-stratos-v3
        image: general-task
        config:
          platform: linux
          inputs:
            - name: stratos-v3-source
            - name: config
          outputs:
            - name: compiled-v3
          params:
            NG_CLI_ANALYTICS: "false"
            # develop-branch toolchain requirements (see .tool-versions)
            GO_VERSION: "1.26.5"
            NODE_VERSION: "26.2.0"
            BUN_VERSION: "1.3.14"
          run:
            path: /bin/bash
            args:
              - -exc
              - |
                # NOTE: this task requires outbound network egress to
                # go.dev/dl, nodejs.org (via nvm), bun.sh and the npm
                # registry to install the v5 build toolchain and deps.

                # -- zip (required by build/release-cf.sh to package the CF zip) --
                if ! command -v zip >/dev/null 2>&1; then
                  apt-get update && apt-get install -y zip
                fi

                cd stratos-v3-source

                # -- Apply dev-only stratos-v3 customizations (from config repo) --
                # 1. stratos.yaml drives packages.exclude (removes the
                #    Workloads/Kubernetes/Helm nav items) and the build-time
                #    title; read by the build's extension-generator +
                #    index-transformer. This is the same shared stratos.yaml
                #    used by the 4.x flow (no separate stratos-v3.yaml).
                # 2. company-config.json is the 5.x runtime branding config
                #    (served at /assets/company-config.json): app name, colors,
                #    login page, footer. It replaces the theme package default.
                # 3. Branding assets (logo, nav-logo, favicon) overlay the
                #    stock core assets referenced by company-config.json.
                cp ../config/stratos.yaml ./stratos.yaml
                cp ../config/custom-v3/company-config.json \
                  src/frontend/packages/theme/company-config.json
                cp ../config/custom-v3/assets/core/logo.png \
                  src/frontend/packages/core/assets/logo.png
                cp ../config/custom-v3/assets/core/nav-logo.png \
                  src/frontend/packages/core/assets/nav-logo.png
                # favicon.ico location varies across branches; overlay wherever
                # a stock one exists so the build picks up the branded icon.
                for f in \
                  src/frontend/packages/core/favicon.ico \
                  src/frontend/packages/core/src/favicon.ico; do
                  if [ -f "$f" ]; then
                    cp ../config/custom-v3/assets/favicon.ico "$f"
                  fi
                done
                # NOTE: the legacy "nosplash" login auto-redirect is now built
                # into the upstream source (cloudfoundry/stratos PR #5678), so
                # no login-page overlay/patch step is needed here.

                ARCH="$(uname -m)"
                case "$ARCH" in
                  x86_64) GOARCH=amd64 ;;
                  aarch64|arm64) GOARCH=arm64 ;;
                  *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
                esac

                # -- Go --
                curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz" -o /tmp/go.tgz
                rm -rf /usr/local/go
                tar -C /usr/local -xzf /tmp/go.tgz
                export PATH="/usr/local/go/bin:${PATH}"
                export GOPATH="${PWD}/../gopath"
                export PATH="${GOPATH}/bin:${PATH}"
                go version

                # -- Node (via nvm) --
                export NVM_DIR="${PWD}/../.nvm"
                mkdir -p "$NVM_DIR"
                curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
                . "$NVM_DIR/nvm.sh"
                nvm install "${NODE_VERSION}"
                nvm use "${NODE_VERSION}"
                node --version

                # -- Bun --
                export BUN_INSTALL="${PWD}/../.bun"
                curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
                export PATH="${BUN_INSTALL}/bin:${PATH}"
                bun --version

                # -- Build + package CF zip --
                # The Makefile evaluates `npx tsc --version` at parse time
                # (version.mk). With no node_modules and no TTY, npx blocks
                # forever on an install confirmation prompt. Populate deps
                # first with `bun install` so tsc resolves locally, and set
                # npm_config_yes so npx never prompts. Then build via make.
                export npm_config_yes=true
                export CI=true
                timeout 1800 bun install

                # -- Regenerate custom-import.module.ts from our stratos.yaml --
                # The app imports ./custom-import.module (NO underscore):
                #   app.module.ts   -> CustomImportModule
                #   app.routing.ts  -> CustomRoutingImportModule
                # The build's extension-generator writes _custom-import.module.ts
                # (WITH underscore); the old webpack build swapped one for the
                # other via a module-replacement plugin, but the new esbuild
                # `application` builder does not, so the committed
                # custom-import.module.ts (which still imports Kubernetes) is
                # what actually gets bundled. Regenerate BOTH names from our
                # packages.exclude so @stratosui/kubernetes (Workloads/
                # Kubernetes/Helm) is really dropped. Run after bun install so
                # node_modules/deps for the generator are present.
                node build/extension-generator.mjs \
                  --output src/frontend/packages/core/src/custom-import.module.ts
                node build/extension-generator.mjs \
                  --output src/frontend/packages/core/src/_custom-import.module.ts
                echo "---- generated custom-import.module.ts ----"
                cat src/frontend/packages/core/src/custom-import.module.ts

                timeout 1800 make build release cf

                # release-cf.sh emits dist/stratos-cf-<version>.zip
                ls -lah dist/
                cp dist/stratos-cf-*.zip ../compiled-v3/
                cd ../compiled-v3
                ls -lah
      - put: compiled-v3
        params:
          file: compiled-v3/stratos-cf-*.zip

  - name: deploy-stratos-v3-dev
    serial: true
    plan:
      - in_parallel:
          - get: compiled-v3
            passed: [compile-stratos-v3]
            trigger: true
          - get: config
            trigger: false
          - get: general-task
      - put: cf-dev
        params:
          # The s3 resource stores under versioned_file, so the downloaded
          # file is named stratos-cf-v3.zip regardless of the built filename.
          path: compiled-v3/stratos-cf-v3.zip
          current_app_name: stratos-v3
          manifest: config/manifest.yml
          show_app_log: true
          vars:
            name: stratos-v3
            instances: "3"
            route: ((dev-v3-cf-route))
          environment_variables:
            GO_SHA256: "aaaa70f2fb5a7803"
            CF_API_URL: ((dev-cf-api-url))
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((dev-v3-cf-route))/*"
            CF_CLIENT: stratos-v3
            CF_CLIENT_SECRET: ((dev-cf-client-secret))
            SESSION_STORE_SECRET: ((dev-session-store-secret))
            DB_SSL_MODE: "verify-ca"
            LOG_LEVEL: "debug"
            # Opt into the built-in Content-Security-Policy (CONSOLE_CSP) to
            # validate the CSP-header change on dev. Use "default" for the
            # built-in policy, or a full policy string to override.
            # CONSOLE_CSP: false
#    on_failure:
#      put: slack
#      params:
#        text: |
#          :x: FAILED to deploy Stratos v3 on dev
#          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
#        channel: ((dev-slack-channel))
#        username: ((slack-username))
#        icon_url: ((slack-icon-url))

  - name: deploy-staging
    serial: true
    plan:
      - in_parallel:
          - get: compiled
            passed: [deploy-dev]
            trigger: true
            params:
              unpack: true
          - get: config
            trigger: false
          - get: general-task
      - put: create-db
        resource: cf-cli-staging
        params:
          <<: *db-params
      - put: cf-staging
        params:
          path: compiled/
          current_app_name: stratos
          manifest: compiled/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((staging-cf-route))
          environment_variables:
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((staging-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((staging-cf-client-secret))
            SESSION_STORE_SECRET: ((staging-session-store-secret))
            DB_SSL_MODE: "verify-ca"
      - put: cf-staging
        # This can eventually be removed, once we're sure nobody is linking to
        # dashboard-beta.
        params:
          path: config/redirects
          manifest: config/redirects/manifest.yml
          current_app_name: dashboard-beta-redirects
          vars:
            external-route: dashboard-beta.fr-stage.cloud.gov
            app-route: dashboard-beta.apps.fr-stage.cloud.gov
            deprecated-route: dashboard-deprecated.fr-stage.cloud.gov
            redirect-url: dashboard.fr-stage.cloud.gov
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos on staging
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((staging-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

  - name: deploy-production
    serial: true
    plan:
      - in_parallel:
          - get: compiled
            passed: [deploy-staging]
            trigger: true
            params:
              unpack: true
          - get: config
            trigger: false
          - get: general-task
      - put: create-db
        resource: cf-cli-production
        params:
          <<: *db-params
      - put: cf-production
        params:
          path: compiled/
          current_app_name: stratos
          manifest: compiled/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((production-cf-route))
          environment_variables:
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((production-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((production-cf-client-secret))
            SESSION_STORE_SECRET: ((production-session-store-secret))
            DB_SSL_MODE: "verify-ca"
      - put: cf-production
        # This can eventually be removed, once we're sure nobody is linking to
        # dashboard-beta.
        params:
          path: config/redirects
          manifest: config/redirects/manifest.yml
          current_app_name: dashboard-beta-redirects
          vars:
            external-route: dashboard-beta.fr.cloud.gov
            app-route: dashboard-beta.app.cloud.gov
            deprecated-route: dashboard-deprecated.fr.cloud.gov
            redirect-url: dashboard.fr.cloud.gov
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos on production
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((production-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

resource_types:
  - name: registry-image
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: registry-image-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: cf-cli-resource
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: cf-cli-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: git
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: git-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: cf
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: cf-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: slack-notification
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: slack-notification-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: s3-iam
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: s3-resource
      aws_region: us-gov-west-1
      tag: latest

resources:
  - name: stratos-source
    type: git
    icon: github-circle
    source:
      uri: https://github.com/cloud-gov/stratos
      branch: main
      commit_verification_keys: ((cloud-gov-pgp-keys))

  - name: config
    type: git
    icon: github-circle
    source:
      uri: https://github.com/cloud-gov/cg-deploy-stratos.git
      branch: v3
      commit_verification_keys: ((cloud-gov-pgp-keys))

  - name: cf-dev
    type: cf
    icon: cloud-upload
    source:
      api: ((dev-cf-api-url))
      username: ((dev-cf-username))
      password: ((dev-cf-password))
      organization: ((dev-cf-organization))
      space: ((dev-cf-space))

  - name: cf-staging
    type: cf
    icon: cloud-upload
    source:
      api: ((staging-cf-api-url))
      username: ((staging-cf-username))
      password: ((staging-cf-password))
      organization: ((staging-cf-organization))
      space: ((staging-cf-space))

  - name: cf-production
    type: cf
    icon: cloud-upload
    source:
      api: ((production-cf-api-url))
      username: ((production-cf-username))
      password: ((production-cf-password))
      organization: ((production-cf-organization))
      space: ((production-cf-space))
      cf_cli_version: 8

  - name: cf-cli-dev
    type: cf-cli-resource
    source:
      api: ((dev-cf-api-url))
      username: ((dev-cf-username))
      password: ((dev-cf-password))
      org: ((dev-cf-organization))
      space: ((dev-cf-space))
      cf_cli_version: 8

  - name: cf-cli-staging
    type: cf-cli-resource
    source:
      api: ((staging-cf-api-url))
      username: ((staging-cf-username))
      password: ((staging-cf-password))
      org: ((staging-cf-organization))
      space: ((staging-cf-space))
      cf_cli_version: 8

  - name: cf-cli-production
    type: cf-cli-resource
    source:
      api: ((production-cf-api-url))
      username: ((production-cf-username))
      password: ((production-cf-password))
      org: ((production-cf-organization))
      space: ((production-cf-space))

  - name: pre-compiled
    type: s3-iam
    icon: database
    source:
      bucket: cg-build-artifacts
      versioned_file: deploy-stratos/precompiled-stratos.tgz
      region_name: us-gov-west-1
      server_side_encryption: AES256

  - name: compiled
    type: s3-iam
    icon: database
    source:
      bucket: cg-build-artifacts
      versioned_file: deploy-stratos/compiled-stratos.tgz
      region_name: us-gov-west-1
      server_side_encryption: AES256

  # -- stratos-v3 (dev-only, CF API v3 compatible) --
  # Independent source. Kept separate from `stratos-source` so the
  # existing dev/staging/prod flow is untouched.
  #
  - name: stratos-v3-source
    type: git
    icon: github-circle
    source:
      uri: https://github.com/cloudfoundry/stratos
      branch: develop #develop #fix/nosplash-unauthenticated-autologin

  - name: compiled-v3
    type: s3-iam
    icon: database
    source:
      bucket: cg-build-artifacts
      # Stored as .zip because the artifact is the CF-pushable zip produced
      # by build/release-cf.sh (not a tgz). The stored object always takes
      # this name, so the deploy job globs it as stratos-cf-v3.zip.
      versioned_file: deploy-stratos/stratos-cf-v3.zip
      region_name: us-gov-west-1
      server_side_encryption: AES256

  - name: slack
    type: slack-notification
    icon: slack
    source:
      url: ((slack-webhook-url))

  - name: general-task
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: general-task
      aws_region: us-gov-west-1
      tag: latest
