  # ══════════════════════════════════════════════════════════════
  # Stratos 5.x — dev / staging / production deploy pipeline.
  # Replaces the 4.x compile-assets → compile-stratos → deploy-*
  # chain. Uses the upstream cloudfoundry/stratos develop branch
  # (plus cloud.gov fixes) compiled via compile-stratos-v5.
  # ══════════════════════════════════════════════════════════════
  - name: compile-stratos-v5
    serial: true
    plan:
      - in_parallel:
          - get: stratos-v5-source
            trigger: true
          - get: config
            trigger: true
          - get: general-task
      - task: build-stratos-v5
        image: general-task
        config:
          platform: linux
          inputs:
            - name: stratos-v5-source
            - name: config
          outputs:
            - name: compiled-v5
          params:
            NG_CLI_ANALYTICS: "false"
            GO_VERSION: "1.26.5"
            NODE_VERSION: "26.2.0"
            BUN_VERSION: "1.3.14"
          run:
            path: /bin/bash
            args:
              - -exc
              - |
                if ! command -v zip >/dev/null 2>&1; then
                  apt-get update && apt-get install -y zip
                fi

                cd stratos-v5-source

                cp ../config/stratos.yaml ./stratos.yaml
                cp ../config/custom-v3/company-config.json \
                  src/frontend/packages/theme/company-config.json
                cp ../config/custom-v3/assets/core/logo.png \
                  src/frontend/packages/core/assets/logo.png
                cp ../config/custom-v3/assets/core/nav-logo.png \
                  src/frontend/packages/core/assets/nav-logo.png
                for f in \
                  src/frontend/packages/core/favicon.ico \
                  src/frontend/packages/core/src/favicon.ico; do
                  if [ -f "$f" ]; then
                    cp ../config/custom-v3/assets/favicon.ico "$f"
                  fi
                done

                ARCH="$(uname -m)"
                case "$ARCH" in
                  x86_64) GOARCH=amd64 ;;
                  aarch64|arm64) GOARCH=arm64 ;;
                  *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
                esac

                curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz" -o /tmp/go.tgz
                rm -rf /usr/local/go
                tar -C /usr/local -xzf /tmp/go.tgz
                export PATH="/usr/local/go/bin:${PATH}"
                export GOPATH="${PWD}/../gopath"
                export PATH="${GOPATH}/bin:${PATH}"
                go version

                export NVM_DIR="${PWD}/../.nvm"
                mkdir -p "$NVM_DIR"
                curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
                . "$NVM_DIR/nvm.sh"
                nvm install "${NODE_VERSION}"
                nvm use "${NODE_VERSION}"
                node --version

                export BUN_INSTALL="${PWD}/../.bun"
                curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
                export PATH="${BUN_INSTALL}/bin:${PATH}"
                bun --version

                export npm_config_yes=true
                export CI=true
                timeout 1800 bun install

                node build/extension-generator.mjs \
                  --output src/frontend/packages/core/src/custom-import.module.ts
                node build/extension-generator.mjs \
                  --output src/frontend/packages/core/src/_custom-import.module.ts

                timeout 1800 make build release cf

                ls -lah dist/
                cp dist/stratos-cf-*.zip ../compiled-v5/
                cd ../compiled-v5
                ls -lah
      - put: compiled-v5
        params:
          file: compiled-v5/stratos-cf-*.zip

  - name: deploy-dev-v5
    serial: true
    plan:
      - in_parallel:
          - get: compiled-v5
            passed: [compile-stratos-v5]
            trigger: true
          - get: config
            trigger: false
          - get: general-task
      - put: create-db-dev-v5
        resource: cf-cli-dev
        params:
          command: create-service
          update_service: true
          wait_for_service: true
          timeout: 1200
          service_instance: stratos-db-v5-encrypted
          service: aws-rds
          plan: medium-psql
      - put: cf-dev
        params:
          path: compiled-v5/stratos-cf-v5.zip
          current_app_name: stratos
          manifest: config/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((dev-cf-route))
            db_service: stratos-db-v5-encrypted
          environment_variables:
            CF_API_URL: ((dev-cf-api-url))
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((dev-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((dev-cf-client-secret))
            SESSION_STORE_SECRET: ((dev-session-store-secret))
            ENCRYPTION_KEY: ((dev-db-encryption-key))
            DB_SSL_MODE: "verify-ca"
            CONSOLE_CSP: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' data: https://fonts.gstatic.com;
              img-src 'self' data: https://api.github.com https://avatars.githubusercontent.com https://workshop.cloud.gov https://gitlab.com https://secure.gravatar.com;
              connect-src 'self' https://api.github.com https://workshop.cloud.gov https://gitlab.com;
              worker-src 'self' blob:;
              frame-ancestors 'self';
              base-uri 'self';
              form-action 'self'
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos v5 on dev
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((dev-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

  - name: deploy-staging-v5
    serial: true
    plan:
      - in_parallel:
          - get: compiled-v5
            passed: [deploy-dev-v5]
            trigger: true
          - get: config
            trigger: false
          - get: general-task
      - put: create-db-staging-v5
        resource: cf-cli-staging
        params:
          command: create-service
          update_service: true
          wait_for_service: true
          timeout: 1200
          service_instance: stratos-db-v5-encrypted
          service: aws-rds
          plan: medium-psql
      - put: cf-staging
        params:
          path: compiled-v5/stratos-cf-v5.zip
          current_app_name: stratos
          manifest: config/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((staging-cf-route))
            db_service: stratos-db-v5-encrypted
          environment_variables:
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((staging-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((staging-cf-client-secret))
            SESSION_STORE_SECRET: ((staging-session-store-secret))
            ENCRYPTION_KEY: ((staging-db-encryption-key))
            DB_SSL_MODE: "verify-ca"
            CONSOLE_CSP: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' data: https://fonts.gstatic.com;
              img-src 'self' data: https://api.github.com https://avatars.githubusercontent.com https://workshop.cloud.gov https://gitlab.com https://secure.gravatar.com;
              connect-src 'self' https://api.github.com https://workshop.cloud.gov https://gitlab.com;
              worker-src 'self' blob:;
              frame-ancestors 'self';
              base-uri 'self';
              form-action 'self'
      - put: cf-staging
        # This can eventually be removed, once we're sure nobody is linking to
        # dashboard-beta.
        params:
          path: config/redirects
          manifest: config/redirects/manifest.yml
          current_app_name: dashboard-beta-redirects
          vars:
            external-route: dashboard-beta.fr-stage.cloud.gov
            app-route: dashboard-beta.apps.fr-stage.cloud.gov
            deprecated-route: dashboard-deprecated.fr-stage.cloud.gov
            redirect-url: dashboard.fr-stage.cloud.gov
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos v5 on staging
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((staging-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

  - name: deploy-production-v5
    serial: true
    plan:
      - in_parallel:
          - get: compiled-v5
            passed: [deploy-staging-v5]
            trigger: true
          - get: config
            trigger: false
          - get: general-task
      - put: create-db-production-v5
        resource: cf-cli-production
        params:
          command: create-service
          update_service: true
          wait_for_service: true
          timeout: 1200
          service_instance: stratos-db-v5-encrypted
          service: aws-rds
          plan: medium-psql
      - put: cf-production
        params:
          path: compiled-v5/stratos-cf-v5.zip
          current_app_name: stratos
          manifest: config/manifest.yml
          show_app_log: true
          vars:
            name: stratos
            instances: "3"
            route: ((production-cf-route))
            db_service: stratos-db-v5-encrypted
          environment_variables:
            SSO_LOGIN: "true"
            SSO_OPTIONS: "nosplash,logout"
            SSO_WHITELIST: "https://((production-cf-route))/*"
            CF_CLIENT: stratos
            CF_CLIENT_SECRET: ((production-cf-client-secret))
            SESSION_STORE_SECRET: ((production-session-store-secret))
            ENCRYPTION_KEY: ((production-db-encryption-key))
            DB_SSL_MODE: "verify-ca"
            CONSOLE_CSP: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' data: https://fonts.gstatic.com;
              img-src 'self' data: https://api.github.com https://avatars.githubusercontent.com https://workshop.cloud.gov https://gitlab.com https://secure.gravatar.com;
              connect-src 'self' https://api.github.com https://workshop.cloud.gov https://gitlab.com;
              worker-src 'self' blob:;
              frame-ancestors 'self';
              base-uri 'self';
              form-action 'self'
      - put: cf-production
        # This can eventually be removed, once we're sure nobody is linking to
        # dashboard-beta.
        params:
          path: config/redirects
          manifest: config/redirects/manifest.yml
          current_app_name: dashboard-beta-redirects
          vars:
            external-route: dashboard-beta.fr.cloud.gov
            app-route: dashboard-beta.app.cloud.gov
            deprecated-route: dashboard-deprecated.fr.cloud.gov
            redirect-url: dashboard.fr.cloud.gov
    on_failure:
      put: slack
      params:
        text: |
          :x: FAILED to deploy Stratos v5 on production
          <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
        channel: ((production-slack-channel))
        username: ((slack-username))
        icon_url: ((slack-icon-url))

