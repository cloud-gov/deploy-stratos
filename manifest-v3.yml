---
# Dev-only deployment manifest for the v3-compatible Stratos (stratos-v3).
# Secrets and SSO settings are injected by the Concourse pipeline via the
# cf-dev put's `environment_variables` — do NOT add secrets to this file.
applications:
  - name: stratos-v3
    routes:
      - route: ((route))
    memory: 512M
    disk_quota: 512M
    timeout: 180
    buildpacks:
      - binary_buildpack
    health-check-type: port
    instances: 1
    command: ./jetstream
    # Bind the shared Postgres DB so persistence features are enabled. Without
    # a bound DB the app falls back to SQLite, which reports
    # disablePersistenceFeatures=true and silently breaks the Home and
    # Endpoints nav (see cloud-gov/private#3023, #3024).
    services:
      - stratos-db
